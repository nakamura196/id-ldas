<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDAS ID</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="guestBand" class="title-band" hidden>
  <div class="inner">
    <h1 data-i18n="home.heroTitle"></h1>
    <p class="lead" data-i18n="home.lead"></p>
    <div class="band-actions">
      <a class="button" href="/login" data-i18n="home.ctaPrimary"></a>
      <a class="button secondary" href="/verify" data-i18n="home.ctaVerify"></a>
    </div>
  </div>
</section>

<section id="memberBand" class="title-band" hidden>
  <div class="inner">
    <h1 data-i18n="home.accountTitle"></h1>
    <p class="lead" data-i18n="home.accountLead"></p>
  </div>
</section>

<main class="wide-page">
  <section id="guest" hidden>
    <div class="home-overview">
      <div>
        <h2 class="section-heading" data-i18n="home.stepsTitle"></h2>
        <div class="info-list">
          <div class="info-list-item">
            <span class="step-num">1</span>
            <div>
              <h3 data-i18n="home.step1Title"></h3>
              <p data-i18n="home.step1Text"></p>
            </div>
          </div>
          <div class="info-list-item">
            <span class="step-num">2</span>
            <div>
              <h3 data-i18n="home.step2Title"></h3>
              <p data-i18n="home.step2Text"></p>
            </div>
          </div>
          <div class="info-list-item">
            <span class="step-num">3</span>
            <div>
              <h3 data-i18n="home.step3Title"></h3>
              <p data-i18n="home.step3Text"></p>
            </div>
          </div>
        </div>
      </div>
      <div class="home-visual">
        <img src="/hero.jpg" alt="LDAS ID" loading="eager">
      </div>
    </div>

    <div class="tech-strip">
      <span data-i18n="home.techNote"></span>
      <div class="tech-strip-links">
        <a href="/verify" data-i18n="home.toVerify"></a>
        <a href="/.well-known/did.json" data-i18n="home.didDoc"></a>
        <a href="/docs">API Docs (OpenAPI)</a>
      </div>
    </div>
  </section>

  <p id="msg" role="status"></p>

  <section id="member" class="member-grid" hidden>
    <div class="member-card">
      <h2><span id="who"></span></h2>
      <p id="status" class="muted" style="margin:0;"></p>
      <div class="member-meta">
        <p id="orcidRow" hidden>ORCID iD: <a id="orcid" target="_blank" rel="noopener"></a></p>
        <p>
          <span data-i18n="home.affiliation"></span>:
          <strong id="affiliation"></strong>
          <span id="emailDomain" class="muted" style="font-size:0.9em;"></span>
          <span id="affilBadge" hidden class="verified-tag" data-i18n="home.verifiedBadge"></span>
        </p>
        <p id="walletRow" hidden><span data-i18n="home.wallet"></span>: <code id="wallet"></code></p>
      </div>
    </div>

    <div class="member-card">
      <h2 class="member-card-title" data-i18n="home.affilTitle"></h2>
      <div id="affilVerifiedCard" hidden class="verified-box">
        <div class="verified-box-title" id="affilVerifiedHeadline"></div>
        <div class="verified-box-meta" id="affilVerifiedMeta"></div>
        <button id="toggleAffilForm" type="button" class="secondary small" style="margin-top:10px;" data-i18n="home.reverifyAffil"></button>
      </div>
      <div id="affilFormWrap">
        <p class="hint" style="margin:0 0 12px;" data-i18n="home.affilDesc"></p>
        <div class="inline-row" style="margin-bottom:8px;">
          <input id="emailInput" type="email" style="flex:1; min-width:220px;" data-i18n-placeholder="home.emailPlaceholder">
          <button id="sendEmailCode" type="button" class="secondary small" data-i18n="home.sendCode"></button>
          <a id="grdmLink" class="button secondary small" href="/auth/grdm" hidden data-i18n="home.grdmLink"></a>
        </div>
        <div id="emailVerifyBox" hidden class="inline-row" style="margin-top:8px;">
          <input id="codeInput" type="text" inputmode="numeric" maxlength="6" style="width:140px;" data-i18n-placeholder="home.codePlaceholder">
          <button id="verifyEmailCode" type="button" class="small" data-i18n="home.verifyCode"></button>
          <span id="devCodeHint" class="hint"></span>
        </div>
        <p id="affilMsg" role="status" style="margin:8px 0 0; font-size:0.88em; font-weight:600;"></p>
      </div>
    </div>

    <div class="member-card">
      <h2 class="member-card-title" data-i18n="home.memberActionsTitle"></h2>
      <div class="member-actions">
        <button id="issue" hidden data-i18n="home.issue"></button>
        <button id="addPasskey" class="secondary" data-i18n="home.addPasskey"></button>
        <button id="revokeSelf" class="danger" data-i18n="home.revokeSelf"></button>
        <button id="logout" class="secondary" data-i18n="home.logout"></button>
      </div>
      <div id="vc" hidden style="margin-top:16px;">
        <h3 data-i18n="home.vcTitle"></h3>
        <p data-i18n-html="home.vcText"></p>
        <textarea id="jwt" readonly rows="6"></textarea>
        <h3 data-i18n="home.payload"></h3>
        <pre id="payload"></pre>
      </div>
    </div>

    <details class="optional-box">
      <summary data-i18n="home.walletOptionalSummary"></summary>
      <div class="note" style="margin-top:0;">
        <strong data-i18n="home.noteTitle"></strong>
        <ul>
          <li data-i18n-html="home.note1"></li>
          <li data-i18n="home.note2"></li>
          <li data-i18n="home.note3"></li>
          <li data-i18n="home.note4"></li>
        </ul>
      </div>
      <button id="linkWallet" class="secondary"></button>
    </details>
  </section>
</main>

<script type="module">
import { startRegistration } from 'https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@14.0.0/+esm';
import { t, onLangChange, adminNav } from '/ui.js';

// Backward compatibility: redirect /?return_to=... to the dedicated /authorize page.
const incomingReturn = new URLSearchParams(location.search).get('return_to');
if (incomingReturn) {
  location.replace(`/authorize?return_to=${encodeURIComponent(incomingReturn)}`);
}

const $ = (id) => document.getElementById(id);
const msg = (text, bad) => { $('msg').textContent = text; $('msg').className = bad ? 'bad' : ''; };
let user = null;
let jwt = '';
let grdmEnabled = false;
let emailChallengeId = '';
let showAffilFormOverride = false;

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const doc = await r.json();
  if (!r.ok) throw new Error(doc.errors?.[0]?.title || doc.error || r.statusText);
  return doc.data?.attributes ?? doc;
}

function render() {
  $('guestBand').hidden = !!user;
  $('guest').hidden = !!user;
  $('memberBand').hidden = !user;
  $('member').hidden = !user;
  adminNav.hidden = !user?.isAdmin;
  if (!user) return;
  $('who').textContent = user.name;
  $('orcidRow').hidden = !user.orcid;
  if (user.orcid) {
    $('orcid').textContent = user.orcid;
    $('orcid').href = `https://orcid.org/${user.orcid}`;
  }
  $('status').textContent = t(`status.${user.status}`);
  const hasAffil = Boolean(user.affiliation || user.email_domain);
  $('affiliation').textContent = user.affiliation || t('home.none');
  $('emailDomain').textContent = user.email_domain ? `(${user.email_domain})` : '';
  $('affilBadge').hidden = !hasAffil;
  $('affilVerifiedCard').hidden = !hasAffil;
  $('affilFormWrap').hidden = hasAffil && !showAffilFormOverride;
  if (hasAffil) {
    const methodLabel = user.affiliation_method === 'grdm-oauth' ? t('home.methodGrdm') : t('home.methodEmail');
    const verifiedDate = user.affiliation_verified_at
      ? new Date(user.affiliation_verified_at).toLocaleString()
      : '';
    $('affilVerifiedHeadline').textContent = t(
      'home.affilVerifiedHeadline',
      user.affiliation || user.email_domain || '',
      user.email_domain ? ` (${user.email_domain})` : '',
    );
    $('affilVerifiedMeta').textContent = t('home.affilVerifiedMeta', methodLabel, verifiedDate);
  }
  $('grdmLink').hidden = !grdmEnabled;
  $('issue').hidden = user.status !== 'approved' && user.status !== 'verified';
  $('walletRow').hidden = !user.wallet;
  $('wallet').textContent = user.wallet || t('home.none');
  $('linkWallet').textContent = t(user.wallet ? 'home.relink' : 'home.link');
  if (jwt) $('toVerify').href = `/verify#${jwt}`;
}
onLangChange(render);

async function refresh() {
  const doc = await (await fetch('/api/me')).json();
  user = doc.data ? { id: doc.data.id, ...doc.data.attributes } : null;
  grdmEnabled = !!doc.meta?.grdmEnabled;
  render();
}

$('toggleAffilForm').onclick = () => {
  showAffilFormOverride = !showAffilFormOverride;
  render();
};

const setAffilMsg = (text, bad = false) => {
  const el = $('affilMsg');
  el.textContent = text;
  el.className = bad ? 'bad' : 'ok';
};

$('sendEmailCode').onclick = async () => {
  const btn = $('sendEmailCode');
  btn.disabled = true;
  setAffilMsg('送信中...');
  try {
    const email = $('emailInput').value.trim();
    if (!email) throw new Error(t('home.emailPlaceholder'));
    const res = await post('/api/email/challenge', { email });
    emailChallengeId = res.challengeId;
    $('emailVerifyBox').hidden = false;
    $('devCodeHint').textContent = res.devCode ? `[localhost dev code: ${res.devCode}]` : '';
    const sentText = t('msg.codeSent', res.emailDomain, res.affiliation);
    setAffilMsg(sentText, false);
    msg(sentText);
  } catch (err) {
    setAffilMsg(err.message, true);
    msg(err.message, true);
  } finally {
    btn.disabled = false;
  }
};

$('verifyEmailCode').onclick = async () => {
  const btn = $('verifyEmailCode');
  btn.disabled = true;
  try {
    const code = $('codeInput').value.trim();
    const res = await post('/api/email/verify', { challengeId: emailChallengeId, code });
    $('emailVerifyBox').hidden = true;
    $('emailInput').value = '';
    $('codeInput').value = '';
    $('devCodeHint').textContent = '';
    emailChallengeId = '';
    showAffilFormOverride = false;
    $('vc').hidden = true;
    jwt = '';
    const okText = t('msg.affilVerified', res.affiliation, res.emailDomain);
    setAffilMsg(okText, false);
    msg(okText);
    refresh();
  } catch (err) {
    setAffilMsg(err.message, true);
    msg(err.message, true);
  } finally {
    btn.disabled = false;
  }
};

$('addPasskey').onclick = async () => {
  try {
    const optionsJSON = await post('/api/register/options');
    const response = await startRegistration({ optionsJSON });
    await post('/api/register/verify', response);
    msg(t('msg.passkeyAdded'));
  } catch (err) { msg(t('msg.passkeyFailed', err.message), true); }
};

// Linking a wallet = signing a one-time message. No transaction, no gas, nothing on chain.
$('linkWallet').onclick = async () => {
  try {
    if (!window.ethereum) throw new Error(t('msg.noMetaMask'));
    const [address] = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const { message } = await post('/api/wallet/challenge');
    const signature = await window.ethereum.request({ method: 'personal_sign', params: [message, address] });
    const { wallet } = await post('/api/wallet/verify', { address, signature });
    msg(t('msg.linked', wallet));
    $('vc').hidden = true;
    jwt = '';
    refresh();
  } catch (err) { msg(t('msg.linkFailed', err.message), true); }
};

$('revokeSelf').onclick = async () => {
  if (!confirm(t('home.revokeConfirm'))) return;
  try {
    const res = await post('/api/credential/revoke');
    $('vc').hidden = true;
    jwt = '';
    msg(t('msg.revokedSelf', res.revokedIndex, res.newStatusIndex));
  } catch (err) { msg(err.message, true); }
};

$('logout').onclick = async () => { await post('/api/logout'); $('vc').hidden = true; jwt = ''; msg(''); refresh(); };

$('issue').onclick = async () => {
  try {
    const res = await post('/api/credential');
    jwt = res.jwt;
    $('jwt').value = jwt;
    $('payload').textContent = JSON.stringify(res.credential, null, 2);
    $('vc').hidden = false;
    render();
  } catch (err) { msg(err.message, true); }
};

const q = new URLSearchParams(location.search);
if (q.get('orcid') === 'cancelled') msg(t('msg.orcidCancelled'), true);
if (q.get('grdm') === 'linked') msg(t('msg.grdmLinked'));
if (q.get('grdm') === 'cancelled') msg(t('msg.grdmCancelled'), true);
if (q.get('grdm') === 'unconfigured') msg(t('msg.grdmUnconfigured'), true);
refresh();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorize — LDAS ID</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="auth-page">
  <div class="card">
    <div class="card-header">
      <div class="card-badge">LDAS ID</div>
      <h1 data-i18n="authz.title"></h1>
      <p class="lead" data-i18n="authz.lead"></p>
    </div>

    <section id="invalidBox" class="note" hidden>
      <p id="invalidMsg"></p>
      <p><a href="/" data-i18n="verify.back"></a></p>
    </section>

    <section id="consentBox" hidden>
      <div class="target-pill">
        <span id="targetOrigin"></span>
      </div>

      <p style="font-size:13.5px; color:var(--muted); margin:0 0 8px;" data-i18n="authz.requestText"></p>

      <div class="claim-list">
        <label class="claim-row" id="rowName">
          <input type="checkbox" id="chkName" checked>
          <span class="claim-body">
            <span class="claim-label" data-i18n="authz.claimName"></span>
            <span class="claim-value" id="cName"></span>
          </span>
          <span class="pill pill-opt" id="reqName"></span>
        </label>

        <label class="claim-row" id="rowOrcid">
          <input type="checkbox" id="chkOrcid" checked>
          <span class="claim-body">
            <span class="claim-label">ORCID iD</span>
            <span class="claim-value" id="cOrcid"></span>
          </span>
          <span class="pill pill-opt" id="reqOrcid"></span>
        </label>

        <label class="claim-row" id="rowMember">
          <input type="checkbox" id="chkMember" checked>
          <span class="claim-body">
            <span class="claim-label" data-i18n="authz.claimMember"></span>
            <span class="claim-value">LDAS</span>
          </span>
          <span class="pill pill-opt" id="reqMember"></span>
        </label>

        <label class="claim-row" id="rowAffiliation">
          <input type="checkbox" id="chkAffiliation" checked>
          <span class="claim-body">
            <span class="claim-label" data-i18n="authz.claimAffiliation"></span>
            <span class="claim-value" id="cAffiliation"></span>
          </span>
          <span class="pill pill-opt" id="reqAffiliation"></span>
        </label>

        <label class="claim-row" id="rowEmailDomain">
          <input type="checkbox" id="chkEmailDomain" checked>
          <span class="claim-body">
            <span class="claim-label" data-i18n="authz.claimEmailDomain"></span>
            <span class="claim-value" id="cEmailDomain"></span>
          </span>
          <span class="pill pill-opt" id="reqEmailDomain"></span>
        </label>

        <label class="claim-row" id="rowWallet">
          <input type="checkbox" id="chkWallet" checked>
          <span class="claim-body">
            <span class="claim-label" data-i18n="home.wallet"></span>
            <span class="claim-value" id="cWallet"></span>
          </span>
          <span class="pill pill-opt" id="reqWallet"></span>
        </label>
      </div>

      <p id="notApproved" class="bad" hidden></p>

      <div class="action-bar">
        <button id="approveBtn" class="full" data-i18n="authz.approve"></button>
        <div class="action-row" style="justify-content:space-between;">
          <button id="switchBtn" class="secondary small" data-i18n="authz.switchAccount"></button>
          <button id="cancelBtn" class="secondary small" data-i18n="authz.cancel"></button>
        </div>
      </div>

      <details class="tech-details">
        <summary data-i18n="authz.techSummary"></summary>
        <p>Protocol: <code id="protocolBadge"></code></p>
        <p>Issuer DID: <code>did:web:id.ldas.jp</code> · Format: <code>dc+sd-jwt (RFC 9901 / kb+jwt)</code></p>
        <p id="nonceInfo"></p>
      </details>
    </section>

    <p id="msg" role="status"></p>
  </div>
</main>

<script type="module">
import { t, onLangChange } from '/ui.js';

const $ = (id) => document.getElementById(id);
const msg = (text, bad) => { $('msg').textContent = text; $('msg').className = bad ? 'bad' : ''; };

let user = null;
let targetUrl = null;
let oid4vpMode = false;
let reqNonce = null;
let reqState = null;
let reqClientId = null;
let dcqlCredentialId = 'member-credential';
let requiredClaims = new Set();

function parseDcql(raw) {
  const req = new Set();
  let credId = 'member-credential';
  if (!raw) return { req, credId };
  try {
    const q = JSON.parse(raw);
    if (Array.isArray(q.credentials) && q.credentials[0]?.id) {
      credId = String(q.credentials[0].id);
    }
    for (const cred of q.credentials || []) {
      for (const claim of cred.claims || []) {
        const path = Array.isArray(claim.path) ? claim.path : [];
        const key = path[path.length - 1];
        if (['name', 'orcid', 'memberOf', 'wallet', 'affiliation', 'emailDomain'].includes(key)) req.add(key);
      }
    }
  } catch {}
  return { req, credId };
}

function toB64Url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function signKeyBindingJwt(sdJwtWithoutKb, privateKey, { aud, nonce }) {
  const sdHashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sdJwtWithoutKb));
  const sd_hash = toB64Url(new Uint8Array(sdHashBuf));
  const header = toB64Url(new TextEncoder().encode(JSON.stringify({ alg: 'ES256', typ: 'kb+jwt' })));
  const payload = toB64Url(
    new TextEncoder().encode(
      JSON.stringify({
        iat: Math.floor(Date.now() / 1000),
        aud,
        ...(nonce ? { nonce } : {}),
        sd_hash,
      }),
    ),
  );
  const signingInput = `${header}.${payload}`;
  const sigBuf = await crypto.subtle.sign(
    { name: 'ECDSA', hash: 'SHA-256' },
    privateKey,
    new TextEncoder().encode(signingInput),
  );
  return `${signingInput}.${toB64Url(new Uint8Array(sigBuf))}`;
}

function matchesOriginPattern(u, pattern) {
  const m = /^(https?):\/\/(\*\.[^/:]+|[^/:]+)(?::(\*|\d+))?$/.exec(pattern);
  if (!m) return false;
  const [, proto, hostPat, portPat] = m;
  if (u.protocol !== `${proto}:`) return false;
  if (hostPat.startsWith('*.')) {
    const suffix = hostPat.slice(1);
    if (!u.hostname.endsWith(suffix) || u.hostname.length <= suffix.length) return false;
  } else if (u.hostname !== hostPat) {
    return false;
  }
  if (portPat && portPat !== '*' && u.port !== portPat) return false;
  if (!portPat && u.port) return false;
  return true;
}

function clientIdMatches(clientId, rawRedirect, target) {
  return clientId === target.origin || clientId === `redirect_uri:${rawRedirect}` || clientId === rawRedirect;
}

function parseAllowedReturnTo(raw, patterns) {
  if (!raw) return null;
  try {
    const u = new URL(raw);
    if (!patterns.some((pat) => matchesOriginPattern(u, pat))) return null;
    u.hash = '';
    return u;
  } catch {
    return null;
  }
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body ?? {}),
  });
  const doc = await r.json();
  if (!r.ok) throw new Error(doc.errors?.[0]?.title || doc.error || r.statusText);
  return doc.data?.attributes ?? doc;
}

function render() {
  if (!targetUrl || !user) return;
  $('consentBox').hidden = false;
  // Always show where the credential will actually be sent. client_id is only a label the
  // requester chose, so it is checked against redirect_uri below and never shown on its own.
  $('targetOrigin').textContent = targetUrl.origin;
  $('protocolBadge').textContent = oid4vpMode ? 'OID4VP (vp_token)' : 'return_to';
  $('nonceInfo').textContent = reqNonce ? `nonce: ${reqNonce}` : '';
  $('cName').textContent = user.name || '';
  $('cOrcid').textContent = user.orcid || '';
  $('cAffiliation').textContent = user.affiliation || t('home.none');
  $('cEmailDomain').textContent = user.email_domain || t('home.none');
  $('cWallet').textContent = user.wallet || t('home.none');

  const map = [
    ['name', 'chkName', 'reqName', 'rowName'],
    ['orcid', 'chkOrcid', 'reqOrcid', 'rowOrcid'],
    ['memberOf', 'chkMember', 'reqMember', 'rowMember'],
    ['affiliation', 'chkAffiliation', 'reqAffiliation', 'rowAffiliation'],
    ['emailDomain', 'chkEmailDomain', 'reqEmailDomain', 'rowEmailDomain'],
    ['wallet', 'chkWallet', 'reqWallet', 'rowWallet'],
  ];
  const isLdasMember = user.status === 'approved';
  const canIssue = user.status === 'approved' || user.status === 'verified';

  for (const [key, chkId, reqId, rowId] of map) {
    const isReq = requiredClaims.has(key);
    const badge = $(reqId);
    badge.textContent = isReq ? t('authz.required') : t('authz.optional');
    badge.className = isReq ? 'pill pill-req' : 'pill pill-opt';
    $(rowId).classList.toggle('is-required', isReq);

    const missing =
      (key === 'orcid' && !user.orcid) ||
      (key === 'memberOf' && !isLdasMember) ||
      (key === 'wallet' && !user.wallet) ||
      (key === 'affiliation' && !user.affiliation) ||
      (key === 'emailDomain' && !user.email_domain);

    if (missing) {
      $(chkId).checked = false;
      $(chkId).disabled = true;
    } else if (isReq) {
      $(chkId).checked = true;
      $(chkId).disabled = true;
    } else {
      $(chkId).disabled = false;
    }
  }

  $('approveBtn').hidden = !canIssue;
  $('notApproved').hidden = canIssue;
  if (!canIssue) $('notApproved').textContent = t(`status.${user.status}`);
}
onLangChange(render);

$('approveBtn').onclick = async () => {
  if (!targetUrl) return;
  try {
    const disclose = [];
    if ($('chkName').checked) disclose.push('name');
    if ($('chkOrcid').checked) disclose.push('orcid');
    if ($('chkMember').checked) disclose.push('memberOf');
    if ($('chkAffiliation').checked && user.affiliation) disclose.push('affiliation');
    if ($('chkEmailDomain').checked && user.email_domain) disclose.push('emailDomain');
    if ($('chkWallet').checked && user.wallet) disclose.push('wallet');

    // Generate an ephemeral P-256 holder key pair in the browser (RFC 9901 Key Binding)
    const holderKeys = await crypto.subtle.generateKey(
      { name: 'ECDSA', namedCurve: 'P-256' },
      false,
      ['sign', 'verify'],
    );
    const holderPubJwk = await crypto.subtle.exportKey('jwk', holderKeys.publicKey);
    const cnfJwk = { kty: holderPubJwk.kty, crv: holderPubJwk.crv, x: holderPubJwk.x, y: holderPubJwk.y };
    const audience = reqClientId || targetUrl.origin;

    const res = await post('/api/credential', {
      format: 'dc+sd-jwt',
      disclose,
      cnfJwk,
    });

    // Ensure SD-JWT ends with '~' before appending kb+jwt per RFC 9901 Section 4
    const sdJwtBase = res.jwt.endsWith('~') ? res.jwt : `${res.jwt}~`;
    const kbJwt = await signKeyBindingJwt(sdJwtBase, holderKeys.privateKey, {
      aud: audience,
      nonce: reqNonce || undefined,
    });
    const fullSdJwt = `${sdJwtBase}${kbJwt}`;

    if (oid4vpMode) {
      // OID4VP 1.0 DCQL response format: vp_token is a JSON object mapping query ID -> [credential]
      const vpTokenObj = { [dcqlCredentialId]: [fullSdJwt] };
      const frag = new URLSearchParams({ vp_token: JSON.stringify(vpTokenObj) });
      if (reqState) frag.set('state', reqState);
      location.href = `${targetUrl.toString()}#${frag.toString()}`;
    } else {
      location.href = `${targetUrl.toString()}#vc=${encodeURIComponent(fullSdJwt)}`;
    }
  } catch (err) {
    msg(err.message, true);
  }
};

$('cancelBtn').onclick = () => {
  location.href = targetUrl ? targetUrl.toString() : '/';
};

$('switchBtn').onclick = async () => {
  await post('/api/logout');
  location.href = `/login?next=${encodeURIComponent(location.pathname + location.search)}`;
};

(async () => {
  const doc = await (await fetch('/api/me')).json();
  const meUser = doc.data ? { id: doc.data.id, ...doc.data.attributes } : null;
  const patterns = doc.meta?.allowedReturnOrigins || [];
  const params = new URLSearchParams(location.search);
  const responseType = params.get('response_type');
  oid4vpMode = responseType === 'vp_token';
  reqNonce = params.get('nonce');
  reqState = params.get('state');
  reqClientId = params.get('client_id');
  const parsedDcql = parseDcql(params.get('dcql_query'));
  requiredClaims = parsedDcql.req;
  dcqlCredentialId = parsedDcql.credId;

  const rawRedirect = oid4vpMode ? params.get('redirect_uri') : params.get('return_to');
  targetUrl = parseAllowedReturnTo(rawRedirect, patterns);

  if (!targetUrl) {
    $('invalidBox').hidden = false;
    $('invalidMsg').textContent = rawRedirect ? t('home.returnInvalid') : t('authz.missingReturn');
    return;
  }

  // client_id must name the same place as redirect_uri (OID4VP 1.0: a bare origin, or the
  // "redirect_uri:" prefix). Otherwise a page could ask for a credential addressed (aud) to
  // another app and replay it there.
  if (reqClientId && !clientIdMatches(reqClientId, rawRedirect, targetUrl)) {
    $('invalidBox').hidden = false;
    $('invalidMsg').textContent = t('authz.clientMismatch');
    targetUrl = null;
    return;
  }

  if (!meUser) {
    const next = `${location.pathname}${location.search}`;
    location.replace(`/login?next=${encodeURIComponent(next)}`);
    return;
  }

  user = meUser;
  render();
})();
</script>
</body>
</html>

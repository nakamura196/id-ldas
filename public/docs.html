<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Docs (OpenAPI / Swagger) — LDAS ID</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.20.0/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .topbar-custom { background: #0f172a; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .topbar-custom a { color: #93c5fd; text-decoration: none; font-weight: 600; margin-left: 16px; }
  </style>
</head>
<body>
  <div class="topbar-custom">
    <strong>LDAS ID — OpenAPI 3.1 / Swagger UI</strong>
    <div>
      <a href="/openapi.json">openapi.json</a>
      <a href="/">LDAS ID へ戻る</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.20.0/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
    });
  </script>
</body>
</html>

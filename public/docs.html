<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Docs (OpenAPI / Swagger) — LDAS ID</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.20.0/swagger-ui.css">
  <style>
    body { margin: 0; background: #f7f9fb; font-family: "BIZ UDPGothic", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; }
    .topbar-custom { background: #07538f; color: #ffffff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; }
    .topbar-custom a { color: rgba(255, 255, 255, 0.9); text-decoration: none; font-weight: 600; margin-left: 14px; }
    .topbar-custom a:hover { color: #ffffff; text-decoration: underline; }
    .topbar-custom a:focus-visible { outline: 2px solid #ffcd00; outline-offset: 2px; }
    .topbar-custom .btn-login { background: #0b8bee; color: #ffffff; padding: 6px 12px; border-radius: 4px; font-size: 13px; text-decoration: none; }
    .topbar-custom .btn-login:hover { background: #096fbe; text-decoration: none; }
    .auth-status { font-size: 12px; color: #ffcd00; margin-left: 12px; }
  </style>
</head>
<body>
  <div class="topbar-custom">
    <div>
      <strong>LDAS ID — OpenAPI 3.1 / Swagger UI</strong>
      <span id="authStatus" class="auth-status"></span>
    </div>
    <div>
      <a id="loginBtn" class="btn-login" href="/login?next=/docs">ログインして試す</a>
      <a href="/openapi.json">openapi.json</a>
      <a href="/">LDAS ID へ戻る</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.20.0/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
    });
    fetch('/api/me', { credentials: 'include' })
      .then((r) => r.json())
      .then((doc) => {
        const user = doc && doc.data && doc.data.attributes;
        if (user) {
          document.getElementById('authStatus').textContent = 'ログイン中: ' + user.name;
          const btn = document.getElementById('loginBtn');
          btn.textContent = 'アカウント設定';
          btn.href = '/';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
